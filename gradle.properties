org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.5.0 was only tested up to compileSdk 34; compileSdk 35 works fine
# in practice but prints a warning on every build. Suppress it explicitly
# rather than pinning to an older compileSdk.
android.suppressUnsupportedCompileSdk=35
